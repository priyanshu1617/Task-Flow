<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - Intro</title>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- Landing specific styles -->
  <link rel="stylesheet" href="css/landing.css">
</head>
<body class="bg-intro">
  
  <main class="intro-container">
    <div class="logo-container">
      <div class="logo-icon">
        <i class="ph-fill ph-check-square-offset"></i>
      </div>
      <h1 class="intro-title">
        <span class="gradient-text">TASK</span>FLOW
      </h1>
      <h2 class="intro-subtitle">Plan better. Get more done.</h2>
      <p class="intro-desc">
        A simple and powerful task tracker to organize your day and focus on what matters.
      </p>
    </div>

    <div class="intro-actions">
      <a href="login.html" class="btn-primary">
        <i class="ph ph-rocket-launch"></i> Get Started
      </a>
    </div>

    <div class="features-row">
      <div class="feature-item">
        <i class="ph-fill ph-lightning feature-icon"></i>
        <div class="feature-text">
          <h4>Simple</h4>
          <p>Easy to use</p>
        </div>
      </div>
      <div class="feature-item" style="border-left: 1px solid var(--landing-card-border); padding-left: 48px;">
        <i class="ph-fill ph-clock feature-icon"></i>
        <div class="feature-text">
          <h4>Fast</h4>
          <p>Save time</p>
        </div>
      </div>
      <div class="feature-item" style="border-left: 1px solid var(--landing-card-border); padding-left: 48px;">
        <i class="ph-fill ph-shield-check feature-icon"></i>
        <div class="feature-text">
          <h4>Personal</h4>
          <p>Your data, your way</p>
        </div>
      </div>
    </div>
  </main>

  <div style="text-align: center; color: var(--landing-text-muted); font-size: 0.9rem; padding: 24px;">
    Organize. Focus. Achieve. <i class="ph-fill ph-heart" style="color: var(--landing-primary);"></i>
  </div>

</body>
</html>
